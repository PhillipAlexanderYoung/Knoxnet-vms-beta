# Minimal, version-tolerant MediaMTX config for desktop/supervisor runs.
# Keep this conservative so bundled binaries across versions can start.

logLevel: info
logDestinations: [stdout]

# Control API used by backend health/probing and recording control.
api: yes
apiAddress: 127.0.0.1:9997
apiEncryption: no

# Playback server for serving recorded segments over HTTP.
playback: yes
playbackAddress: :9996

# Core listeners used by Knoxnet components.
rtsp: yes
rtspAddress: :8554

hls: yes
hlsAddress: :8888

webrtc: yes
webrtcAddress: :8889

pathDefaults:
  record: no
  recordPath: ../recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10m
  recordDeleteAfter: 720h

paths:
  all_others:
    source: publisher

  d9c2a53e-1028-45c5-8602-9c3a1fa3769e:
    source: rtsp://kadmin:$Knoxnet1@10.10.10.176:554/stream2
    sourceProtocol: tcp
    sourceOnDemand: no
    record: yes
    recordPath: /home/operator1/Documents/Knoxnet-VMS/recordings/_176/%Y-%m-%d/%H-%M-%S-%f_%path

  f162f1a7-7193-4d65-a4bf-b88cbd03efd8:
