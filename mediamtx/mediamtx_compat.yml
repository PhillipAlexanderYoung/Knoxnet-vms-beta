    sourceProtocol: tcp
    sourceOnDemand: no
    record: yes
    recordPath: /home/operator1/Documents/Knoxnet-VMS/recordings/_140/%Y-%m-%d/%H-%M-%S-%f_%path

  d2728e43-32cb-4186-ad6e-4a09895e74b6:
    source: rtsp://kadmin:$Knoxnet1@10.10.10.103:554/stream2
    sourceProtocol: tcp
